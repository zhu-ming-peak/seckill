server:
  address: ${APP_ADDRESS:127.0.0.1}
  port: ${APP_PORT:18092}
spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  application:
    name: seckill-lab2
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lab2_seckill}?connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${DB_USER:lab2_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
mybatis:
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    edu.tju.lab2: INFO
seckill:
  redis-enabled: ${REDIS_ENABLED:true}
  product-cache-ttl-seconds: ${PRODUCT_CACHE_TTL_SECONDS:60}
  redis-prefix: ${REDIS_PREFIX:lab2:v3:}
  mq-enabled: ${MQ_ENABLED:true}
  mq-namesrv: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
  mq-topic: ${ROCKETMQ_TOPIC:Lab2OrdersV3}
  mq-consumer-group: ${ROCKETMQ_CONSUMER_GROUP:lab2-orders-v3}
  mq-consumer-enabled: ${MQ_CONSUMER_ENABLED:true}
